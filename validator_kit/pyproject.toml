[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "validator-kit"
version = "0.1.0"
description = "Local map labeler for damage, waste, and building GeoJSON on a GeoTIFF."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "shapely>=2.0",
]

[project.scripts]
validator-kit = "validator_kit.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/validator_kit"]

[tool.hatch.build.targets.wheel.force-include]
"src/validator_kit/static/index.html" = "validator_kit/static/index.html"
"src/validator_kit/static/app.css" = "validator_kit/static/app.css"
"src/validator_kit/static/app.js" = "validator_kit/static/app.js"

[tool.pytest.ini_options]
testpaths = ["tests"]
